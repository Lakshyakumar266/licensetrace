<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 780" width="100%" height="100%" style="background:#070a12; font-family:'Fira Code', 'Cascadia Code', Menlo, Consolas, Monaco, monospace;">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Terminal Window Frame -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Window Body -->
    <rect x="0" y="0" width="1000" height="720" rx="12" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect x="0" y="0" width="1000" height="42" rx="12" fill="#131c31"/>
    <circle cx="24" cy="21" r="6.5" fill="#ef4444"/>
    <circle cx="46" cy="21" r="6.5" fill="#f59e0b"/>
    <circle cx="68" cy="21" r="6.5" fill="#10b981"/>
    <text x="500" y="26" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">terminal — licensetrace forensic audit workflow</text>

    <!-- Terminal Content Area -->
    <g transform="translate(28, 70)" font-size="12.5" line-height="1.55">
      <!-- Section 1: Skill Installation -->
      <text x="0" y="0" fill="#38bdf8" font-weight="700">➜ </text>
      <text x="18" y="0" fill="#a78bfa" font-weight="600">~/licensetrace</text>
      <text x="135" y="0" fill="#f1f5f9" font-weight="600">npx skills add https://github.com/Lakshyakumar266/licensetrace</text>
      
      <text x="0" y="24" fill="#4ade80">✔ Fetched skill manifest from repository</text>
      <text x="0" y="44" fill="#94a3b8">✔ Installed 'licensetrace' (v0.1.0) into .agents/skills/licensetrace</text>
      <text x="0" y="64" fill="#64748b">  Format: Standalone Agent Skill (Zero runtime npm dependencies)</text>

      <!-- Section 2: Audit p-limit -->
      <text x="0" y="100" fill="#38bdf8" font-weight="700">➜ </text>
      <text x="18" y="100" fill="#a78bfa" font-weight="600">~/licensetrace</text>
      <text x="135" y="100" fill="#f1f5f9" font-weight="600">bun scripts/licensetrace.ts repos/p-limit --output-dir reports/validation/p-limit</text>
      
      <text x="0" y="126" fill="#e2e8f0">🔍 Investigating license evidence in: repos/p-limit (Git rev: a8a6fbe)</text>
      <text x="0" y="148" fill="#94a3b8">📁 Output destination: reports/validation/p-limit</text>
      
      <text x="0" y="172" fill="#38bdf8">📜 [E-0001] Extracted root license candidate: 'license' (10 lines) [SHA-256: 4f18a2c1...]</text>
      <text x="0" y="194" fill="#38bdf8">📦 [E-0002] Parsed package manifest: 'package.json' (SPDX declared: MIT)</text>
      
      <text x="0" y="218" fill="#c084fc">⏳ Tracing Git commit archaeology (depth: 50 commits)...</text>
      <text x="0" y="238" fill="#e2e8f0">   ├─ [E-0003] 'license' first recorded in commit 0038c55 by Sindre Sorhus (2020-06-06)</text>
      <text x="0" y="258" fill="#e2e8f0">   ├─ [E-0004] 'package.json' first recorded in commit 0038c55 by Sindre Sorhus</text>
      <text x="0" y="278" fill="#e2e8f0">   └─ [E-0005] 'readme.md' first recorded in commit 0038c55 by Sindre Sorhus</text>
      <text x="0" y="300" fill="#f59e0b">⚠️  Notice: Shallow clone detected (commit history truncated to depth 50)</text>

      <text x="0" y="330" fill="#4ade80" font-weight="700">✅ LicenseTrace investigation completed! [Elapsed: 420ms]</text>
      <text x="0" y="352" fill="#f1f5f9">📊 Summary status: <tspan fill="#4ade80" font-weight="700">supported</tspan> (6 evidence records collected, 0 material conflicts)</text>
      <text x="0" y="374" fill="#94a3b8">   📄 Manifest: reports/validation/p-limit/manifest.json</text>
      <text x="0" y="394" fill="#94a3b8">   📦 Evidence: reports/validation/p-limit/evidence.json</text>
      <text x="0" y="414" fill="#94a3b8">   📝 Report:   reports/validation/p-limit/report.md</text>

      <!-- Section 3: Inspect Report Excerpt -->
      <text x="0" y="450" fill="#38bdf8" font-weight="700">➜ </text>
      <text x="18" y="450" fill="#a78bfa" font-weight="600">~/licensetrace</text>
      <text x="135" y="450" fill="#f1f5f9" font-weight="600">head -n 9 reports/validation/p-limit/report.md</text>
      
      <text x="0" y="474" fill="#f8fafc" font-weight="600"># LicenseTrace Investigation Report</text>
      <text x="0" y="494" fill="#94a3b8">**Run ID:** `run-1793132597604-a6294ca1`  |  **Tool:** `licensetrace v0.1.0`</text>
      <text x="0" y="514" fill="#94a3b8">**Target Revision:** `a8a6fbec4e0e866d6d779b10889bb4f5567e70eb`</text>
      <text x="0" y="534" fill="#94a3b8">**Summary Status:** <tspan fill="#4ade80" font-weight="700">supported</tspan> — Evidence directly corroborates MIT grant</text>
      <text x="0" y="554" fill="#e2e8f0">| Evidence ID | Kind | Source | Locator | Classification |</text>
      <text x="0" y="574" fill="#e2e8f0">| E-0001 | license_file | license | L1-L10 | direct (MIT text) |</text>
      <text x="0" y="594" fill="#e2e8f0">| E-0002 | package_metadata | package.json | L1-L59 | corroborating (MIT) |</text>

      <!-- Section 4: Audit tj/co with README section discovery -->
      <text x="0" y="630" fill="#38bdf8" font-weight="700">➜ </text>
      <text x="18" y="630" fill="#a78bfa" font-weight="600">~/licensetrace</text>
      <text x="135" y="630" fill="#f1f5f9" font-weight="600">bun scripts/licensetrace.ts repos/co --output-dir reports/validation/co</text>
      
      <text x="0" y="654" fill="#e2e8f0">🔍 Found root 'LICENSE' (23 lines) + 'Readme.md' section '## License' (L199-L213)</text>
      <text x="0" y="674" fill="#c084fc">⏳ Traced commit 4d2a63c by Jonathan Ong | Target working tree: completely unmodified (read-only)</text>
    </g>
  </g>
</svg>
