<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background:#090d16; font-family:'Fira Code', 'Cascadia Code', Menlo, Consolas, Monaco, monospace;">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window Frame -->
  <g transform="translate(30, 25)">
    <!-- Shadow -->
    <rect x="0" y="0" width="900" height="490" rx="12" fill="#000000" opacity="0.6"/>
    <!-- Body -->
    <rect x="0" y="0" width="900" height="490" rx="10" fill="url(#termGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect x="0" y="0" width="900" height="38" rx="10" fill="#1e293b"/>
    <circle cx="20" cy="19" r="6" fill="#ef4444"/>
    <circle cx="40" cy="19" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="19" r="6" fill="#10b981"/>
    <text x="450" y="24" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">bash — bun scripts/licensetrace.ts (real-repository audit)</text>

    <!-- Terminal Content -->
    <g transform="translate(25, 70)" font-size="13" line-height="1.6">
      <!-- Command 1 -->
      <text x="0" y="0" fill="#38bdf8" font-weight="700">➜ </text>
      <text x="20" y="0" fill="#f1f5f9" font-weight="600">bun scripts/licensetrace.ts ../repos/p-limit --output-dir reports/validation/p-limit</text>
      
      <!-- Output 1 -->
      <text x="0" y="28" fill="#e2e8f0">🔍 Investigating license evidence in: repos/p-limit</text>
      <text x="0" y="52" fill="#94a3b8">📁 Output destination: reports/validation/p-limit</text>
      <text x="0" y="76" fill="#a855f7">📜 Extracted root license: 'license' (L1-L10) [SHA-256: 4f18a2...]</text>
      <text x="0" y="100" fill="#a855f7">📦 Parsed package manifest: 'package.json' (SPDX declared: MIT)</text>
      <text x="0" y="124" fill="#38bdf8">⏳ Tracing Git commit archaeology (depth: 50 commits)...</text>
      <text x="0" y="148" fill="#e2e8f0">   ├─ license: commit 0038c55 (Sindre Sorhus, 2020-06-06)</text>
      <text x="0" y="172" fill="#e2e8f0">   └─ package.json: commit 0038c55 (Sindre Sorhus, 2020-06-06)</text>
      <text x="0" y="196" fill="#f59e0b">⚠️  Shallow history detected: Truncated commit depth flagged in manifest</text>
      
      <text x="0" y="230" fill="#4ade80" font-weight="700">✅ LicenseTrace investigation completed!</text>
      <text x="0" y="254" fill="#f1f5f9">📊 Summary status: <tspan fill="#4ade80" font-weight="700">supported</tspan> (6 evidence records, 0 conflicts)</text>
      <text x="0" y="278" fill="#64748b">📄 Manifest: reports/validation/p-limit/manifest.json</text>
      <text x="0" y="302" fill="#64748b">📦 Evidence: reports/validation/p-limit/evidence.json</text>
      <text x="0" y="326" fill="#64748b">📝 Report:   reports/validation/p-limit/report.md</text>

      <!-- Command 2 -->
      <text x="0" y="365" fill="#38bdf8" font-weight="700">➜ </text>
      <text x="20" y="365" fill="#f1f5f9" font-weight="600">npx skills add . --list</text>
      <text x="0" y="393" fill="#4ade80">✔ Found 1 skill in current directory:</text>
      <text x="20" y="417" fill="#e2e8f0">licensetrace — Forensic open-source software license &amp; copyright archaeologist</text>
    </g>
  </g>
</svg>
