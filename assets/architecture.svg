<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151e34"/>
      <stop offset="100%" stop-color="#0f1626"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb199"/>
      <stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1a2642" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="280" y1="0" x2="280" y2="680"/>
    <line x1="580" y1="0" x2="580" y2="680"/>
    <line x1="880" y1="0" x2="880" y2="680"/>
  </g>

  <!-- Title Header -->
  <text x="60" y="55" fill="#f8fafc" font-size="26" font-weight="700" letter-spacing="0.5">LicenseTrace Architecture</text>
  <text x="380" y="55" fill="#38bdf8" font-size="14" font-weight="500">Forensic Open-Source License Archaeology Engine</text>
  <rect x="1000" y="32" width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="1070" y="52" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">v0.1.0 • Standalone</text>

  <!-- STAGE 1: INPUT REPOSITORY -->
  <g transform="translate(60, 100)">
    <rect width="200" height="520" rx="12" fill="url(#cardGrad1)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="42" rx="12" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="27" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1">1. REPOSITORY INPUT</text>

    <!-- Sub items -->
    <rect x="16" y="65" width="168" height="70" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="28" y="92" fill="#f1f5f9" font-size="13" font-weight="600">Local Repository</text>
    <text x="28" y="112" fill="#64748b" font-size="11">Read-only file access</text>

    <rect x="16" y="150" width="168" height="90" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="28" y="177" fill="#f1f5f9" font-size="13" font-weight="600">Root License Candidates</text>
    <text x="28" y="197" fill="#64748b" font-size="11">LICENSE, COPYING,</text>
    <text x="28" y="215" fill="#64748b" font-size="11">UNLICENSE, NOTICE</text>

    <rect x="16" y="255" width="168" height="90" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="28" y="282" fill="#f1f5f9" font-size="13" font-weight="600">Package Metadata</text>
    <text x="28" y="302" fill="#64748b" font-size="11">package.json, Cargo.toml,</text>
    <text x="28" y="320" fill="#64748b" font-size="11">pyproject.toml, README</text>

    <rect x="16" y="360" width="168" height="130" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="28" y="387" fill="#f1f5f9" font-size="13" font-weight="600">Git History (.git)</text>
    <text x="28" y="407" fill="#64748b" font-size="11">Commit author/date logs</text>
    <text x="28" y="427" fill="#64748b" font-size="11">Shallow clone detection</text>
    <text x="28" y="447" fill="#64748b" font-size="11">File addition &amp; deletion</text>
    <text x="28" y="467" fill="#f59e0b" font-size="11">Ghost License tracking</text>
  </g>

  <!-- Connectors 1 to 2 -->
  <path d="M 260 250 L 320 250" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="325,250 315,245 315,255" fill="#38bdf8"/>

  <!-- STAGE 2: DETERMINISTIC COLLECTORS -->
  <g transform="translate(320, 100)">
    <rect width="250" height="520" rx="12" fill="url(#cardGrad1)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="42" rx="12" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="27" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">2. EVIDENCE COLLECTORS</text>

    <rect x="16" y="65" width="218" height="95" rx="8" fill="#0d1424" stroke="#0284c7" stroke-width="1"/>
    <text x="28" y="92" fill="#38bdf8" font-size="13" font-weight="600">inventory.ts</text>
    <text x="28" y="112" fill="#94a3b8" font-size="11">• Case-insensitive file finder</text>
    <text x="28" y="130" fill="#94a3b8" font-size="11">• First-50-lines header scan</text>
    <text x="28" y="148" fill="#94a3b8" font-size="11">• Dual-pass copyright grep</text>

    <rect x="16" y="175" width="218" height="110" rx="8" fill="#0d1424" stroke="#0284c7" stroke-width="1"/>
    <text x="28" y="202" fill="#38bdf8" font-size="13" font-weight="600">extract.ts</text>
    <text x="28" y="222" fill="#94a3b8" font-size="11">• Manifest parser (package.json)</text>
    <text x="28" y="240" fill="#94a3b8" font-size="11">• README markdown extractor</text>
    <text x="28" y="258" fill="#94a3b8" font-size="11">• SPDX identifier normalizer</text>
    <text x="28" y="276" fill="#94a3b8" font-size="11">• Line range citation locator</text>

    <rect x="16" y="300" width="218" height="110" rx="8" fill="#0d1424" stroke="#0284c7" stroke-width="1"/>
    <text x="28" y="327" fill="#38bdf8" font-size="13" font-weight="600">git.ts (Forensic Engine)</text>
    <text x="28" y="347" fill="#94a3b8" font-size="11">• Commit history archaeologist</text>
    <text x="28" y="365" fill="#94a3b8" font-size="11">• Detects deleted/dead licenses</text>
    <text x="28" y="383" fill="#94a3b8" font-size="11">• Remote origin extractor</text>
    <text x="28" y="401" fill="#94a3b8" font-size="11">• Flags truncated git depth</text>

    <rect x="16" y="425" width="218" height="75" rx="8" fill="#0d1424" stroke="#e11d48" stroke-width="1"/>
    <text x="28" y="450" fill="#f43f5e" font-size="13" font-weight="600">Security &amp; Hash Shield</text>
    <text x="28" y="470" fill="#94a3b8" font-size="11">• SHA-256 content verification</text>
    <text x="28" y="488" fill="#94a3b8" font-size="11">• Prompt-injection defense</text>
  </g>

  <!-- Connectors 2 to 3 -->
  <path d="M 570 250 L 630 250" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="635,250 625,245 625,255" fill="#38bdf8"/>

  <!-- STAGE 3: CORRELATION & AUDIT ENGINE -->
  <g transform="translate(630, 100)">
    <rect width="250" height="520" rx="12" fill="url(#cardGrad1)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="42" rx="12" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="27" fill="#a855f7" font-size="12" font-weight="700" letter-spacing="1">3. CORRELATION &amp; RULES</text>

    <rect x="16" y="65" width="218" height="135" rx="8" fill="#0d1424" stroke="#7e22ce" stroke-width="1"/>
    <text x="28" y="92" fill="#c084fc" font-size="13" font-weight="600">schema.ts</text>
    <text x="28" y="112" fill="#94a3b8" font-size="11">• Zero-dependency TypeScript</text>
    <text x="28" y="130" fill="#94a3b8" font-size="11">• EvidenceRecord schema</text>
    <text x="28" y="148" fill="#94a3b8" font-size="11">• EvidenceFinding schema</text>
    <text x="28" y="166" fill="#94a3b8" font-size="11">• MaterialConflict schema</text>
    <text x="28" y="184" fill="#94a3b8" font-size="11">• EvidenceBundle schema</text>

    <rect x="16" y="215" width="218" height="150" rx="8" fill="#0d1424" stroke="#7e22ce" stroke-width="1"/>
    <text x="28" y="242" fill="#c084fc" font-size="13" font-weight="600">manifest.ts (Rule Correlator)</text>
    <text x="28" y="262" fill="#94a3b8" font-size="11">• Rule 1: Multi-signal corroboration</text>
    <text x="28" y="280" fill="#94a3b8" font-size="11">• Rule 2: Conflict detection</text>
    <text x="28" y="298" fill="#94a3b8" font-size="11">• Rule 3: Missing license triage</text>
    <text x="28" y="316" fill="#94a3b8" font-size="11">• Status classification:</text>
    <text x="40" y="334" fill="#4ade80" font-size="11">supported</text>
    <text x="105" y="334" fill="#f87171" font-size="11">contradicted</text>
    <text x="40" y="352" fill="#fbbf24" font-size="11">inconclusive</text>
    <text x="120" y="352" fill="#94a3b8" font-size="11">unsupported</text>

    <rect x="16" y="380" width="218" height="120" rx="8" fill="#0d1424" stroke="#7e22ce" stroke-width="1"/>
    <text x="28" y="407" fill="#c084fc" font-size="13" font-weight="600">report.ts (Synthesizer)</text>
    <text x="28" y="427" fill="#94a3b8" font-size="11">• Traceable Markdown compiler</text>
    <text x="28" y="445" fill="#94a3b8" font-size="11">• Structured Table Generator</text>
    <text x="28" y="463" fill="#94a3b8" font-size="11">• Legal disclaimer enforcement</text>
    <text x="28" y="481" fill="#94a3b8" font-size="11">• Unknowns &amp; caveats registry</text>
  </g>

  <!-- Connectors 3 to 4 -->
  <path d="M 880 250 L 940 250" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="945,250 935,245 935,255" fill="#38bdf8"/>

  <!-- STAGE 4: OUTPUT BUNDLES -->
  <g transform="translate(940, 100)">
    <rect width="200" height="520" rx="12" fill="url(#cardGrad1)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="42" rx="12" fill="#131b2e" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="27" fill="#4ade80" font-size="12" font-weight="700" letter-spacing="1">4. AUDIT OUTPUTS</text>

    <rect x="16" y="65" width="168" height="120" rx="8" fill="#0d1424" stroke="#16a34a" stroke-width="1"/>
    <text x="28" y="92" fill="#4ade80" font-size="13" font-weight="600">report.md</text>
    <text x="28" y="112" fill="#94a3b8" font-size="11">Human-readable report</text>
    <text x="28" y="130" fill="#94a3b8" font-size="11">• Evidence table</text>
    <text x="28" y="148" fill="#94a3b8" font-size="11">• Findings citations</text>
    <text x="28" y="166" fill="#94a3b8" font-size="11">• Conflict breakdown</text>

    <rect x="16" y="200" width="168" height="120" rx="8" fill="#0d1424" stroke="#16a34a" stroke-width="1"/>
    <text x="28" y="227" fill="#4ade80" font-size="13" font-weight="600">evidence.json</text>
    <text x="28" y="247" fill="#94a3b8" font-size="11">Machine-readable data</text>
    <text x="28" y="265" fill="#94a3b8" font-size="11">• Full typed records</text>
    <text x="28" y="283" fill="#94a3b8" font-size="11">• SHA-256 digests</text>
    <text x="28" y="301" fill="#94a3b8" font-size="11">• Line locators</text>

    <rect x="16" y="335" width="168" height="110" rx="8" fill="#0d1424" stroke="#16a34a" stroke-width="1"/>
    <text x="28" y="362" fill="#4ade80" font-size="13" font-weight="600">manifest.json</text>
    <text x="28" y="382" fill="#94a3b8" font-size="11">Audit run metadata</text>
    <text x="28" y="400" fill="#94a3b8" font-size="11">• Run UUID &amp; timestamp</text>
    <text x="28" y="418" fill="#94a3b8" font-size="11">• Target commit SHA</text>
    <text x="28" y="436" fill="#94a3b8" font-size="11">• Summary status</text>
  </g>
</svg>
